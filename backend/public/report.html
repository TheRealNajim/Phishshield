<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeceptIQ verdict — shared scan report</title>
<meta name="description" content="An AI agent wrote its own Python in an isolated sandbox and returned a plain-English phishing verdict. Open the DeceptIQ report.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#001b1b">
<meta name="color-scheme" content="dark light">
<meta property="og:type" content="website">
<meta property="og:site_name" content="DeceptIQ">
<meta property="og:title" content="DeceptIQ — shared threat verdict">
<meta property="og:description" content="An AI agent wrote its own Python in an isolated sandbox and returned a plain-English verdict. Open the report.">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="DeceptIQ — shared threat verdict">
<meta name="twitter:description" content="Sandboxed AI phishing verdict with reasons, indicators and the exact analysis code.">
<style>
:root{--bg:#070b14;--panel:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);--txt:#e8eefc;--mut:#93a0bb;--acc:#6e8bff;--acc2:#22d3ee;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185;--font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}body{margin:0;font-family:var(--font);color:var(--txt);background:radial-gradient(700px 380px at 15% -5%,rgba(110,139,255,.28),transparent 60%),radial-gradient(700px 420px at 90% 10%,rgba(34,211,238,.16),transparent 60%),var(--bg);min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:40px 20px 80px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;backdrop-filter:blur(14px)}
.top{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:13px;margin-bottom:18px}
.top a{color:var(--acc2);text-decoration:none}
.v{font-size:40px;font-weight:900;letter-spacing:-1px;margin:6px 0}
.Verified{color:var(--ok)}.Suspicious{color:var(--warn)}.Malicious{color:var(--bad)}
.sub{color:var(--mut);font-family:var(--mono);font-size:12px}
ul{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
li{background:rgba(0,0,0,.32);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:10px;padding:9px 12px;font-size:13.5px}
.btn{display:inline-block;margin-top:18px;border:0;border-radius:11px;padding:12px 20px;font-weight:800;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--acc),#8b5cf6);text-decoration:none}
pre{background:#04070f;border:1px solid var(--line);border-radius:12px;color:#c9f7ff;padding:14px;font-family:var(--mono);font-size:11.5px;max-height:300px;overflow:auto;white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="/">🛡️ DeceptIQ</a><span id="meta">loading shared report…</span></div>
  <div class="card">
    <div class="v" id="v">…</div>
    <div class="sub" id="s"></div>
    <div id="nl" hidden>
      <p id="nl-h" style="margin:16px 0 0;font-size:16px;font-weight:800"></p>
      <p id="nl-s" style="margin:8px 0 0;font-size:14px;line-height:1.5"></p>
      <p id="nl-a" style="margin:10px 0 0;font-size:13.5px;color:var(--mut)"></p>
    </div>
    <ul id="r"></ul>
    <div id="runs" style="margin-top:14px"></div>
    <h4 style="color:var(--mut)">Agent code (ran in sandbox)</h4>
    <pre id="c"></pre>
    <a class="btn" href="/">▶ Scan your own file</a>
  </div>
</div>
<script>
(async function(){
  const id = location.pathname.split('/').pop();
  let j;
  try { j = await (await fetch('/api/analyze/report/' + encodeURIComponent(id))).json(); }
  catch { document.getElementById('v').textContent = 'Report unavailable'; return; }
  if (j.error) { document.getElementById('v').textContent = 'Report not found'; document.getElementById('meta').textContent = 'it may have expired (last 200 kept)'; return; }
  document.title = 'DeceptIQ: ' + j.verdict + ' (' + j.score + ') — ' + (j.filename || 'scan');
  const v = document.getElementById('v');
  v.textContent = j.verdict + ' · ' + j.score; v.className = 'v ' + j.verdict;
  document.getElementById('s').textContent = (j.filename||'') + ' · ' + (j.kind||'') + ' · ' + (j.t||'') + ' · ' + (j.mode||'');
  document.getElementById('meta').textContent = 'shared report ' + j.id;
  if (j.nl && j.nl.headline) {
    document.getElementById('nl-h').textContent = j.nl.headline;
    document.getElementById('nl-s').textContent = j.nl.summary || '';
    document.getElementById('nl-a').textContent = j.nl.action ? 'What to do: ' + j.nl.action : '';
    document.getElementById('nl').hidden = false;
  }
  document.getElementById('r').innerHTML = (j.reasons||[]).map(x=>`<li>${x}</li>`).join('');
  if (j.runs) document.getElementById('runs').innerHTML = '<div class="sub">deep scan · ' + j.runs.map(r=>r.profile+': '+r.verdict+' ('+r.score+')').join(' vs ') + '</div>';
  document.getElementById('c').textContent = (j.agent_code||'// code not stored').slice(0,6000);
})();
</script>
</body>
</html>
